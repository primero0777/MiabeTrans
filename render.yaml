# Blueprint Render — API PHP MiabeTrans (offre gratuite)
# Render > New > Blueprint > choisir ce dépôt
services:
  - type: web
    name: miabetrans-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400"
      - key: CORS_ORIGINS
        sync: false   # ex. https://primero0777.github.io
      - key: FRONTEND_URL
        sync: false   # ex. https://primero0777.github.io/miabetrans
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: miabetrans_db
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL_CA
        sync: false   # contenu complet de ca.pem (Aiven)
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false   # adresse validée comme expéditeur dans Brevo
      - key: MAIL_FROM_NAME
        value: MiabeTrans
      - key: WHATSAPP_NUM
        value: "22890000001"
