# Sécurité : rien d'autre que l'API et les fichiers envoyés n'est servi
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# Fichiers cachés (.env, .git…), scripts SQL, docs et sources de bibliothèques
<FilesMatch "(^\.|\.(sql|md|lock|json|sh|ini|log)$)">
    Require all denied
</FilesMatch>
<DirectoryMatch "^/var/www/html/backend/(lib|config|middleware|database)">
    Require all denied
</DirectoryMatch>

# Les fichiers envoyés ne sont jamais exécutés comme du PHP
<Directory /var/www/html/uploads>
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>

# Le jeton JWT arrive bien jusqu'à PHP
SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
